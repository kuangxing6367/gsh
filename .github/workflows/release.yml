name: Release

# tag 一推就自动出包，不再手搓交叉编译。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v，如 0.2.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 质量门
        run: |
          go vet ./...
          go test ./...

      - name: 交叉编译并打包
        run: |
          chmod +x scripts/build-release.sh
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          scripts/build-release.sh "$VER"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: gsh v${{ env.VER }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
